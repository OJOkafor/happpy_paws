<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY PAWS | DONATE PAGE</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="assets/css/style-donate.css">
</head>

<body>
    <header>
         <img src="assets/_images/new happypawslogo.png" alt="Happy Paws Logo" class="logo" width="250" height="200">
        <h1 class="logo">Happy Paws</h1>
        <nav>
            <button class="menu-toggle">☰ Menu</button>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="adoption.html">Adoption</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact_us.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="donate-list">
       <main>
  <section class="donation-impact">
    <h2>How Your Donations Help</h2>
    <ul class="impact-list">
      <li>
        <figure>
          <img src="assets/_images/medicalcare.jpg" alt="Medical care for pets" width="300" height="200">
          <figcaption>Medical care for rescued pets</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="assets/_images/petfood.jpg" alt="Food supply for animals" width="300" height="200">
          <figcaption>Nutritious food supply</figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <img src="assets/_images/sheltermaintance.jpg" alt="Shelter maintenance" width="300" height="200">
          <figcaption>Shelter maintenance and improvements</figcaption>
        </figure>
      </li>
    </ul>
  </section>

  <section class="donation-methods">
    <h2>Ways to Donate</h2>
    <ul class="methods-list">
      <li><span class="icon">💳</span> Credit/Debit Card</li>
      <li><span class="icon">🏦</span> Bank Transfer</li>
      <li><span class="icon">🎁</span> Donate Supplies</li>
    </ul>
  </section>

  <section class="donate-form-section">
    <h2>Make a Donation</h2>
    <form id="donate-form" action="#" method="post">
      <label for="donor-name">Name:</label>
      <input type="text" id="donor-name" name="donor-name" required>

      <label for="donor-email">Email:</label>
      <input type="email" id="donor-email" name="donor-email" required>

      <label for="donation-amount">Amount (USD):</label>
      <input type="number" id="donation-amount" name="donation-amount" min="1" required>

      <button type="submit">Donate Now</button>
    </form>
  </section>
</main>

    </main>
    <footer>
        <p>&copy; 2025 Happy Paws. All rights reserved.</p>
    </footer>
    <script src="assets/js/script.js"></script>
</body>
</html>
